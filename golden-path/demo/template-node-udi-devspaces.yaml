apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: acme-node-udi-devspaces
  title: Node.js + UDI + Dev Spaces (ROSA demo)
  description: >
    Creates a tiny Node.js repo with a UDI devfile, publishes it to GitHub,
    and gives you an Open in Dev Spaces link for this cluster.
  tags:
    - nodejs
    - udi
    - golden-path
    - demo
    - recommended
spec:
  owner: group:platform-team
  type: service
  parameters:
    - title: Application
      required: [appName]
      properties:
        appName:
          title: Application Name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,28}[a-z0-9]$'
          description: New GitHub repo name under your user
          ui:autofocus: true
        appDescription:
          title: Description
          type: string
          default: Node.js app on Red Hat UDI for Dev Spaces
        githubOwner:
          title: GitHub owner
          type: string
          default: rmallam
        port:
          title: Application port
          type: integer
          default: 3000
        devSpacesBaseUrl:
          title: Dev Spaces URL
          type: string
          default: https://devspaces.apps.rosa.rosa-89s85.bhg0.p3.openshiftapps.com
  steps:
    - id: fetch-skeleton
      name: Fetch Node UDI skeleton
      action: fetch:template
      input:
        url: https://github.com/rmallam/RHDH-SM-DevSpaces/tree/rhdh-demo/golden-path/demo/skeleton-node-udi
        values:
          appName: ${{ parameters.appName }}
          appDescription: ${{ parameters.appDescription }}
          githubOwner: ${{ parameters.githubOwner }}
          port: ${{ parameters.port }}
          devSpacesBaseUrl: ${{ parameters.devSpacesBaseUrl }}
    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: github.com?owner=${{ parameters.githubOwner }}&repo=${{ parameters.appName }}
        description: ${{ parameters.appDescription }}
        defaultBranch: main
        repoVisibility: public
        gitCommitMessage: "Initial Node.js UDI app from golden path"
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Source repository
        url: ${{ steps['publish'].output.remoteUrl }}
        icon: github
      - title: Open in Dev Spaces
        url: ${{ parameters.devSpacesBaseUrl }}/dashboard/#/load/workspace/factory?url=${{ steps['publish'].output.remoteUrl }}&devfilePath=devfile.yaml
        icon: catalog
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
