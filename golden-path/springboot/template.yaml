---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: acme-springboot-app
  title: Acme Spring Boot Application
  description: >
    Creates a production-ready Spring Boot 3 microservice with:
    - Gradle build (Java 21, GraalVM native-image ready)
    - Tekton CI pipeline (build → test → SonarQube → Quay push → sign with Cosign)
    - ArgoCD GitOps deployment (dev → prod promotion)
    - Service Mesh enrolment (ambient mode, Istio mTLS)
    - Backstage catalog-info.yaml pre-wired
  tags:
    - java
    - spring-boot
    - recommended
    - golden-path
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  owner: group:platform-team
  type: service

  parameters:
    - title: Application Details
      required: [appName, appDescription, javaVersion, groupId]
      properties:
        appName:
          title: Application Name
          type: string
          description: Lowercase kebab-case name (e.g. payments-api)
          pattern: '^[a-z][a-z0-9-]{2,48}[a-z0-9]$'
          ui:autofocus: true
        appDescription:
          title: Description
          type: string
          description: One-line description of what this service does
        javaVersion:
          title: Java Version
          type: string
          default: "21"
          enum: ["21", "17"]
          enumNames: ["Java 21 (LTS - recommended)", "Java 17 (LTS)"]
        groupId:
          title: Gradle Group ID
          type: string
          default: com.acme
          description: Java package / Gradle group (e.g. com.acme.payments)
        springBootVersion:
          title: Spring Boot Version
          type: string
          default: "3.4.0"
          description: Spring Boot version (3.x required for Java 21 native)
        nativeImage:
          title: GraalVM Native Image
          type: boolean
          default: false
          description: Build a native executable (faster startup, lower memory — longer build)

    - title: Runtime & Deployment
      required: [targetNamespace, replicas]
      properties:
        targetNamespace:
          title: Target Namespace (dev)
          type: string
          description: Kubernetes namespace for the dev environment
          default: acme-dev
        replicas:
          title: Replicas (dev)
          type: integer
          default: 2
          minimum: 1
          maximum: 10
        cpuRequest:
          title: CPU Request
          type: string
          default: "200m"
        memoryRequest:
          title: Memory Request
          type: string
          default: "512Mi"
        cpuLimit:
          title: CPU Limit
          type: string
          default: "1000m"
        memoryLimit:
          title: Memory Limit
          type: string
          default: "1Gi"
        enrollInMesh:
          title: Enrol in Service Mesh (ambient mTLS)
          type: boolean
          default: true
          description: Adds istio.io/dataplane-mode=ambient label to the namespace

    - title: Source Control
      required: [repoOwner]
      properties:
        repoOwner:
          title: GitLab Group / GitHub Org
          type: string
          default: acme
          description: Group or org that will own the new repository
        repoVisibility:
          title: Repo Visibility
          type: string
          default: private
          enum: [private, internal, public]

    - title: CI/CD & Quality
      properties:
        sonarProject:
          title: SonarQube Project Key
          type: string
          description: Leave blank to auto-generate from appName
        enableTekton:
          title: Enable Tekton CI Pipeline
          type: boolean
          default: true
        enableCosign:
          title: Sign images with Cosign (Sigstore)
          type: boolean
          default: true

  steps:
    # ── 1. Fetch the skeleton from the template directory ────────────────────
    - id: fetch-template
      name: Fetch Spring Boot Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          appName: ${{ parameters.appName }}
          appDescription: ${{ parameters.appDescription }}
          groupId: ${{ parameters.groupId }}
          javaVersion: ${{ parameters.javaVersion }}
          springBootVersion: ${{ parameters.springBootVersion }}
          nativeImage: ${{ parameters.nativeImage }}
          targetNamespace: ${{ parameters.targetNamespace }}
          replicas: ${{ parameters.replicas }}
          cpuRequest: ${{ parameters.cpuRequest }}
          memoryRequest: ${{ parameters.memoryRequest }}
          cpuLimit: ${{ parameters.cpuLimit }}
          memoryLimit: ${{ parameters.memoryLimit }}
          enrollInMesh: ${{ parameters.enrollInMesh }}
          repoOwner: ${{ parameters.repoOwner }}
          sonarProject: ${{ parameters.sonarProject or parameters.appName }}
          enableCosign: ${{ parameters.enableCosign }}

    # ── 2. Publish source repo to GitLab ────────────────────────────────────
    - id: publish-source
      name: Publish Application Source to GitLab
      action: publish:gitlab
      input:
        repoUrl: gitlab-gitlab.apps.${{ env.CLUSTER_BASE_DOMAIN }}?owner=${{ parameters.repoOwner }}&repo=${{ parameters.appName }}
        description: ${{ parameters.appDescription }}
        defaultBranch: main
        repoVisibility: ${{ parameters.repoVisibility }}
        sourcePath: .

    # ── 3. Publish GitOps manifests repo ────────────────────────────────────
    - id: publish-gitops
      name: Publish GitOps Manifests to GitLab
      action: publish:gitlab
      input:
        repoUrl: gitlab-gitlab.apps.${{ env.CLUSTER_BASE_DOMAIN }}?owner=${{ parameters.repoOwner }}&repo=${{ parameters.appName }}-gitops
        description: GitOps manifests for ${{ parameters.appName }}
        defaultBranch: main
        repoVisibility: ${{ parameters.repoVisibility }}
        sourcePath: ./gitops

    # ── 4. Create ArgoCD Application for dev ────────────────────────────────
    - id: create-argocd-app
      name: Create ArgoCD Application (dev)
      action: argocd:create-resources
      input:
        appName: ${{ parameters.appName }}-dev
        argoInstance: acme-argocd
        namespace: ${{ parameters.targetNamespace }}
        repoUrl: https://gitlab-gitlab.apps.${{ env.CLUSTER_BASE_DOMAIN }}/${{ parameters.repoOwner }}/${{ parameters.appName }}-gitops.git
        path: overlays/dev
        labelValue: ${{ parameters.appName }}

    # ── 5. Register component in Backstage catalog ───────────────────────────
    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-source'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Source Repository
        url: ${{ steps['publish-source'].output.remoteUrl }}
        icon: github
      - title: GitOps Repository
        url: ${{ steps['publish-gitops'].output.remoteUrl }}
        icon: github
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
