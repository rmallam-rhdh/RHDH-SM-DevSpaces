schemaVersion: 2.2.0
metadata:
  name: ${{ values.appName }}
  version: 1.0.0
  description: Acme golden-path Dev Spaces workspace — VS Code, Git, Java ${{ values.javaVersion }}, Gradle
  attributes:
    metadata.openshift.io/scopes: ['devspaces']
    # Example VS Code extensions — installed on che-code in the workspace (not local laptop).
    # Platform may restrict Marketplace; swap IDs for your allowlisted set.
    .vscode/extensions.json: |
      {
        "recommendations": [
          "vscjava.vscode-java-pack",
          "vscjava.vscode-gradle",
          "redhat.vscode-yaml",
          "redhat.vscode-openshift-tools",
          "ms-azuretools.vscode-docker",
          "SonarSource.sonarlint-vscode",
          "snyk-security.snyk-vulnerability-scanner",
          "GitHub.copilot"
        ]
      }

# VS Code in the browser (che-code) + universal tools image (git, gradle, java, sonar-scanner, snyk CLI)
components:
  - name: che-code
    attributes:
      app.kubernetes.io/component: che-code
      app.kubernetes.io/part-of: che.eclipse.org
      che.code/editor/che-code: latest
    type: cheEditor

  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryLimit: 4Gi
      memoryRequest: 2Gi
      cpuLimit: "2"
      cpuRequest: 500m
      mountSources: true
      sourceMapping: /projects
      env:
        - name: JAVA_HOME
          value: /usr/lib/jvm/java-${{ values.javaVersion }}-openjdk
      endpoints:
        - name: app
          targetPort: 8080
          exposure: public
          secure: true
          protocol: https

projects:
  - name: ${{ values.appName }}
    git:
      remotes:
        origin: https://bitbucket.org/${{ values.bitbucketWorkspace }}/${{ values.appName }}.git
      checkoutFrom:
        remote: origin
        revision: ${{ values.featureBranch | default('main') }}

commands:
  - id: build
    exec:
      component: tools
      commandLine: ./gradlew -q bootJar -x test
      workingDir: ${PROJECTS_ROOT}/${{ values.appName }}
      group:
        kind: build
        isDefault: true

  - id: test
    exec:
      component: tools
      commandLine: ./gradlew -q test
      workingDir: ${PROJECTS_ROOT}/${{ values.appName }}
      group:
        kind: test
        isDefault: true

  - id: run
    exec:
      component: tools
      commandLine: ./gradlew -q bootRun --args='--spring.profiles.active=dev'
      workingDir: ${PROJECTS_ROOT}/${{ values.appName }}
      group:
        kind: run
        isDefault: true

  - id: lint
    exec:
      component: tools
      commandLine: ./scripts/quality-gate.sh --lint-only
      workingDir: ${PROJECTS_ROOT}/${{ values.appName }}

  - id: install-hooks
    exec:
      component: tools
      commandLine: ./scripts/install-git-hooks.sh
      workingDir: ${PROJECTS_ROOT}/${{ values.appName }}

  - id: quality-gate
    exec:
      component: tools
      commandLine: ./scripts/quality-gate.sh
      workingDir: ${PROJECTS_ROOT}/${{ values.appName }}

  - id: sonar
    exec:
      component: tools
      commandLine: ./scripts/quality-gate.sh --sonar
      workingDir: ${PROJECTS_ROOT}/${{ values.appName }}
