---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${{ values.targetNamespace }}
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: ${{ values.appName }}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: ${{ values.replicas }}
commonLabels:
  environment: dev
