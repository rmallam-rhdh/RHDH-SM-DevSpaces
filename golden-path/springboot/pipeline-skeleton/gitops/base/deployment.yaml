---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.appName }}
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
    app.kubernetes.io/part-of: acme-platform
    # ─── Required by Kyverno workload-governance policy ───────────────────────
    backstage.io/kubernetes-id: ${{ values.appName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.appName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.appName }}
        backstage.io/kubernetes-id: ${{ values.appName }}
    spec:
      containers:
        - name: ${{ values.appName }}
          # Jenkins pipeline replaces this with an image@sha256:digest reference
          # satisfying the Kyverno "require-image-digest-in-prod" policy
          image: ${{ values.artifactoryRepo }}/${{ values.appName }}:latest
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "openshift"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "${{ values.cpuRequest }}"
              memory: "${{ values.memoryRequest }}"
            limits:
              cpu: "${{ values.cpuLimit }}"
              memory: "${{ values.memoryLimit }}"
