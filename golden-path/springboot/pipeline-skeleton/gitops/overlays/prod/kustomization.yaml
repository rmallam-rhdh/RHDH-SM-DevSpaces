---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${{ values.prodNamespace }}
resources:
  - ../../base
  - namespace-prod.yaml
patches:
  - path: snow-change-annotation.yaml
  - target:
      kind: Deployment
      name: ${{ values.appName }}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: ${{ values.prodReplicas }}
commonLabels:
  environment: prod
