---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${{ values.prodNamespace }}
resources:
  - ../../base
  - namespace-prod.yaml
patches:
  - target:
      kind: Deployment
      name: ${{ values.appName }}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: ${{ values.prodReplicas }}
      # Jenkins pipeline will also patch /spec/template/metadata/annotations/acme.io~1jira-change-ticket
commonLabels:
  environment: prod
