apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ROSA lab: redhat-operators (no snapshot catalog), no Vault mesh CA.
resources:
  - ../../base/namespace.yaml
  - ../../base/instance/cluster-monitoring-config.yaml
  - ../../base/operator/subscription-kiali.yaml
  - ../../base/operator/subscription-servicemesh.yaml
  - ../../base/instance/istiocni.yaml
  - ../../base/instance/istio.yaml
  - ../../base/instance/ztunnel.yaml
  - ../../base/instance/kiali.yaml
  - ../../base/instance/telemetry.yaml

patches:
  - target:
      group: operators.coreos.com
      version: v1alpha1
      kind: Subscription
      name: kiali-operator
    patch: |-
      - op: replace
        path: /spec/source
        value: redhat-operators
      - op: replace
        path: /spec/channel
        value: stable
  - target:
      group: operators.coreos.com
      version: v1alpha1
      kind: Subscription
      name: service-mesh-operator
    patch: |-
      - op: replace
        path: /spec/source
        value: redhat-operators
      - op: replace
        path: /spec/channel
        value: stable
  - target:
      group: sailoperator.io
      version: v1
      kind: Istio
      name: default
    patch: |-
      - op: remove
        path: /spec/version
      - op: replace
        path: /spec/values/pilot
        value:
          trustedZtunnelNamespace: ztunnel
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  - target:
      group: sailoperator.io
      version: v1
      kind: IstioCNI
      name: default
    patch: |-
      - op: remove
        path: /spec/version
  - target:
      group: kiali.io
      version: v1alpha1
      kind: Kiali
      name: kiali
    patch: |-
      - op: replace
        path: /spec/auth/strategy
        value: anonymous
      - op: add
        path: /spec/external_services/prometheus/auth/insecure_skip_verify
        value: true
      - op: add
        path: /spec/deployment/probes
        value:
          startup:
            initial_delay_seconds: 15
            period_seconds: 10
            failure_threshold: 18
          readiness:
            initial_delay_seconds: 5
            period_seconds: 10
          liveness:
            initial_delay_seconds: 30
            period_seconds: 30
  - target:
      group: kiali.io
      version: v1alpha1
      kind: OSSMConsole
      name: ossmconsole
    patch: |-
      $patch: delete
      apiVersion: kiali.io/v1alpha1
      kind: OSSMConsole
      metadata:
        name: ossmconsole

commonLabels:
  environment: lab
