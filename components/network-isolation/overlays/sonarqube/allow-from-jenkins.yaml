# Allow Jenkins builds in namespace jenkins to push scan reports to SonarQube.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-jenkins
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: network-isolation
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jenkins
