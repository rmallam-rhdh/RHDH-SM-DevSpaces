# Allow Istio Ambient HBONE traffic (port 15008) and ztunnel-rewritten kubelet
# readiness/liveness probes (169.254.7.127/32) in demo-dev.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mesh-hbone
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: network-isolation
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 15008
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
