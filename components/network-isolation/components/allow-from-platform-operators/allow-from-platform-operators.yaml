# CNPG operator (cnpg-system) and Hub/mesh/Dev Spaces operators (openshift-operators).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-platform-operators
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: network-isolation
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-operators
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
