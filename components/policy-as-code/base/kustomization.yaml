---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ── Kyverno Operator ───────────────────────────────────────────────────────
  - operator/namespace.yaml
  - operator/subscription-kyverno.yaml

  # ── Policy-as-Code: Mesh Enrollment ────────────────────────────────────────
  # auto-enroll-ambient-mesh:     labels namespaces → ambient mode automatically
  # audit-mesh-enrollment:        reports non-enrolled namespaces
  # inject-default-peer-auth:     generates STRICT PeerAuthentication on enrollment
  - policies/mesh-enrollment.yaml

  # ── Policy-as-Code: Workload Governance ────────────────────────────────────
  # require-resource-limits:      all containers must have cpu/mem limits
  # require-standard-labels:      enforce app.kubernetes.io/* + backstage labels
  # disallow-privileged-containers: hard block in mesh namespaces
  - policies/workload-governance.yaml

  # ── Policy-as-Code: DevOps Release Gates ───────────────────────────────────
  # require-image-digest-in-prod:  production images must be pinned by digest
  # require-cosign-signature:      production images must be Cosign-signed
  # require-jira-ticket-annotation: production deploys need a change ticket
  - policies/release-gates.yaml

commonLabels:
  app.kubernetes.io/managed-by: openshift-gitops
  app.kubernetes.io/part-of: acme-platform
  app.kubernetes.io/component: policy-as-code
