---
# Valid ServiceNow Change Request number
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api-valid
  namespace: payments-prod
  annotations:
    acme.io/snow-change-number: "CHG0001234"
  labels:
    app.kubernetes.io/name: payments-api-valid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api-valid
  template:
    metadata:
      labels:
        app: payments-api-valid
    spec:
      containers:
        - name: app
          image: example.com/payments-api@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
---
