# Valid format on StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payments-db-valid
  namespace: payments-prod
  annotations:
    acme.io/snow-change-number: "CHG9999999"
  labels:
    app.kubernetes.io/name: payments-db-valid
spec:
  serviceName: payments-db
  replicas: 1
  selector:
    matchLabels:
      app: payments-db-valid
  template:
    metadata:
      labels:
        app: payments-db-valid
    spec:
      containers:
