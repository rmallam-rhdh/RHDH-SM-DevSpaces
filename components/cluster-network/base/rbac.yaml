---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-network-patcher
  namespace: openshift-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: patch-cluster-network
rules:
  - apiGroups: ["operator.openshift.io"]
    resources: ["networks"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-network-patcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: patch-cluster-network
subjects:
  - kind: ServiceAccount
    name: cluster-network-patcher
    namespace: openshift-gitops
