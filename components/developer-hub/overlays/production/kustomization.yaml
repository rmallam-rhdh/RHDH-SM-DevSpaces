---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Scale to 3 replicas in production
  - target:
      group: rhdh.redhat.com
      version: v1alpha5
      kind: Backstage
      name: acme
    patch: |-
      - op: replace
        path: /spec/deployment/patch/spec/replicas
        value: 3
      - op: replace
        path: /spec/database/enableLocalDb
        value: false

  # Tighten PeerAuthentication to strict-only (no port-level exemptions)
  - target:
      group: security.istio.io
      version: v1beta1
      kind: PeerAuthentication
      name: rhdh-strict-mtls
    patch: |-
      - op: replace
        path: /spec/mtls/mode
        value: STRICT

commonLabels:
  environment: production
