---
# ExternalSecrets — pulls all RHDH secrets from Vault via the cluster-wide
# ClusterSecretStore "vault-secret-store" (ESO + Vault KV v2).
#
# Vault path convention: kv/secrets/rhdh/<secret-name>  property: value
# Before deploying, seed each path in Vault:
#
#   vault kv put kv/secrets/rhdh/jenkins-token value="<jenkins-api-token>"
#   vault kv put kv/secrets/rhdh/azure-tenant-id value="<tenant-id>"
#   ... etc.
#
# The vault role "rhdh-role" must have read policy on kv/secrets/rhdh/*
# ─────────────────────────────────────────────────────────────────────────────

# ── Single consolidated Secret: rhdh-secrets ─────────────────────────────────
# All env vars referenced by the Backstage CR are aggregated here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rhdh-secrets
  namespace: rhdh
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # must exist before the Backstage pod starts
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: rhdh-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # ── Cluster ──────────────────────────────────────────────────────────────
    - secretKey: CLUSTER_BASE_DOMAIN
      remoteRef:
        key: secrets/rhdh/cluster-base-domain
        property: value
    - secretKey: KUBE_API_URL
      remoteRef:
        key: secrets/rhdh/kube-api-url
        property: value
    - secretKey: KUBE_SA_TOKEN
      remoteRef:
        key: secrets/rhdh/kube-sa-token
        property: value
    - secretKey: KUBE_CA_DATA
      remoteRef:
        key: secrets/rhdh/kube-ca-data
        property: value
    # ── Backend / Auth session ────────────────────────────────────────────────
    - secretKey: BACKEND_SECRET
      remoteRef:
        key: secrets/rhdh/backend-secret
        property: value
    - secretKey: AUTH_SESSION_SECRET
      remoteRef:
        key: secrets/rhdh/auth-session-secret
        property: value
    # ── OIDC / Keycloak (primary SSO) ─────────────────────────────────────────
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: secrets/rhdh/oauth-client-id
        property: value
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: secrets/rhdh/oauth-client-secret
        property: value
    - secretKey: KEYCLOAK_PLUGIN_CLIENT_ID
      remoteRef:
        key: secrets/rhdh/keycloak-plugin-acme-id
        property: value
    - secretKey: KEYCLOAK_PLUGIN_CLIENT_SECRET
      remoteRef:
        key: secrets/rhdh/keycloak-plugin-acme-secret
        property: value
    # ── Microsoft Entra ID (additional provider) ──────────────────────────────
    - secretKey: AZURE_TENANT_ID
      remoteRef:
        key: secrets/rhdh/azure-tenant-id
        property: value
    - secretKey: AZURE_CLIENT_ID
      remoteRef:
        key: secrets/rhdh/azure-acme-id
        property: value
    - secretKey: AZURE_CLIENT_SECRET
      remoteRef:
        key: secrets/rhdh/azure-acme-secret
        property: value
    # ── GitHub ────────────────────────────────────────────────────────────────
    - secretKey: GITHUB_OAUTH_CLIENT_ID
      remoteRef:
        key: secrets/rhdh/github-oauth-client-id
        property: value
    - secretKey: GITHUB_OAUTH_CLIENT_SECRET
      remoteRef:
        key: secrets/rhdh/github-oauth-client-secret
        property: value
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: secrets/rhdh/github-token
        property: value
    # ── Jenkins ───────────────────────────────────────────────────────────────
    - secretKey: JENKINS_BASE_URL
      remoteRef:
        key: secrets/rhdh/jenkins-base-url
        property: value
    - secretKey: JENKINS_USERNAME
      remoteRef:
        key: secrets/rhdh/jenkins-username
        property: value
    - secretKey: JENKINS_API_TOKEN
      remoteRef:
        key: secrets/rhdh/jenkins-api-token
        property: value
    - secretKey: JENKINS_BASIC_AUTH_B64
      remoteRef:
        key: secrets/rhdh/jenkins-basic-auth-b64
        property: value
    # ── IBM API Connect ───────────────────────────────────────────────────────
    - secretKey: APIC_BASE_URL
      remoteRef:
        key: secrets/rhdh/apic-base-url
        property: value
    - secretKey: APIC_API_KEY
      remoteRef:
        key: secrets/rhdh/apic-api-key
        property: value
    # ── ArgoCD ────────────────────────────────────────────────────────────────
    - secretKey: ARGOCD_TOKEN
      remoteRef:
        key: secrets/rhdh/argocd-token
        property: value
    - secretKey: ARGOCD_PASSWORD
      remoteRef:
        key: secrets/rhdh/argocd-password
        property: value
    # ── TechDocs S3 ───────────────────────────────────────────────────────────
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: secrets/rhdh/aws-access-key-id
        property: value
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: secrets/rhdh/aws-secret-access-key
        property: value
    # ── SonarQube ─────────────────────────────────────────────────────────────
    - secretKey: SONARQUBE_API_KEY
      remoteRef:
        key: secrets/rhdh/sonarqube-api-key
        property: value
    # ── Bitbucket Cloud ───────────────────────────────────────────────────────
    - secretKey: BITBUCKET_USERNAME
      remoteRef:
        key: secrets/rhdh/bitbucket-username
        property: value
    - secretKey: BITBUCKET_APP_PASSWORD
      remoteRef:
        key: secrets/rhdh/bitbucket-app-password
        property: value
    # ── Bitbucket Server (on-prem) ────────────────────────────────────────────
    - secretKey: BITBUCKET_SERVER_HOST
      remoteRef:
        key: secrets/rhdh/bitbucket-server-host
        property: value
    - secretKey: BITBUCKET_SERVER_TOKEN
      remoteRef:
        key: secrets/rhdh/bitbucket-server-token
        property: value
    # ── Snyk ──────────────────────────────────────────────────────────────────
    - secretKey: SNYK_ORG_SLUG
      remoteRef:
        key: secrets/rhdh/snyk-org-slug
        property: value
    - secretKey: SNYK_TOKEN
      remoteRef:
        key: secrets/rhdh/snyk-token
        property: value
    # ── Jira ──────────────────────────────────────────────────────────────────
    - secretKey: JIRA_BASE_URL
      remoteRef:
        key: secrets/rhdh/jira-base-url
        property: value
    - secretKey: JIRA_TOKEN
      remoteRef:
        key: secrets/rhdh/jira-token
        property: value
    # ── Artifactory (JFrog) ───────────────────────────────────────────────────
    - secretKey: ARTIFACTORY_BASE_URL
      remoteRef:
        key: secrets/rhdh/artifactory-base-url
        property: value
    - secretKey: ARTIFACTORY_TOKEN
      remoteRef:
        key: secrets/rhdh/artifactory-token
        property: value
    # ── LDAP bind (catalog org provider) ──────────────────────────────────────
    - secretKey: LDAP_BIND_PASSWORD
      remoteRef:
        key: secrets/rhdh/ldap-bind-password
        property: value
    # ── Vault plugin (LIST-only token — not the ESO Kubernetes auth) ──────────
    - secretKey: VAULT_ADDR
      remoteRef:
        key: secrets/rhdh/vault-addr
        property: value
    - secretKey: VAULT_TOKEN
      remoteRef:
        key: secrets/rhdh/vault-list-token
        property: value
    # ── ServiceNow ────────────────────────────────────────────────────────────
    - secretKey: SERVICENOW_BASE_URL
      remoteRef:
        key: secrets/rhdh/servicenow-base-url
        property: value
    - secretKey: SERVICENOW_USERNAME
      remoteRef:
        key: secrets/rhdh/servicenow-username
        property: value
    - secretKey: SERVICENOW_PASSWORD
      remoteRef:
        key: secrets/rhdh/servicenow-password
        property: value
    # ── Dynatrace ─────────────────────────────────────────────────────────────
    - secretKey: DYNATRACE_URL
      remoteRef:
        key: secrets/rhdh/dynatrace-url
        property: value
    - secretKey: DYNATRACE_CLIENT_ID
      remoteRef:
        key: secrets/rhdh/dynatrace-client-id
        property: value
    - secretKey: DYNATRACE_CLIENT_SECRET
      remoteRef:
        key: secrets/rhdh/dynatrace-client-secret
        property: value
    - secretKey: DYNATRACE_ACCOUNT_URN
      remoteRef:
        key: secrets/rhdh/dynatrace-account-urn
        property: value
    # ── IBM API Connect (extra OIDC fields; base URL + API key already above) ─
    - secretKey: APIC_API_URL
      remoteRef:
        key: secrets/rhdh/apic-api-url
        property: value
    - secretKey: APIC_CLIENT_ID
      remoteRef:
        key: secrets/rhdh/apic-client-id
        property: value
    - secretKey: APIC_SECRET
      remoteRef:
        key: secrets/rhdh/apic-secret
        property: value
