---
# Default deny-all — nothing reaches Backstage unless explicitly allowed below.
# Enforced by ztunnel at L4 and by the waypoint at L7.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: rhdh-deny-all
  namespace: rhdh
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: developer-hub
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {}
---
# Allow traffic from the Istio ingress gateway (external user traffic)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: rhdh-allow-ingress-gateway
  namespace: rhdh
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: developer-hub
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: rhdh-waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
      to:
        - operation:
            ports: ["7007"]
---
# Allow Prometheus scraping from istio-system
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: rhdh-allow-prometheus
  namespace: rhdh
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: developer-hub
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: rhdh-waypoint
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/prometheus"
      to:
        - operation:
            ports: ["9090"]
---
# Allow Kiali to read workload metadata from the rhdh namespace
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: rhdh-allow-kiali
  namespace: rhdh
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: developer-hub
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/kiali-service-account"
---
# Allow ArgoCD health checks from openshift-gitops namespace.
# Without this, ArgoCD cannot probe /healthz on the Backstage pod and
# marks the Application as Degraded even though the pod is healthy.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: rhdh-allow-argocd
  namespace: rhdh
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: developer-hub
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - "openshift-gitops"
      to:
        - operation:
            ports: ["7007"]
