---
# Allow OpenShift API server to reach devspaces-operator webhook on TCP 9443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-to-devspaces-webhook
  namespace: openshift-devspaces
  labels:
    app.kubernetes.io/part-of: idp-platform
    app.kubernetes.io/component: devspaces-operator
spec:
  podSelector:
    matchLabels:
      app: devspaces-operator
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9443
          protocol: TCP
