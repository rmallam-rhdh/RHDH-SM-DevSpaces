---
# Day-1 only (operators + lab tools). Day-2 CRs (Backstage, Istio, CheCluster,
# CNPG Cluster) are https://github.com/rmallam/rhdh-platform-gitops.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acme-gitops
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: acme-platform
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam/RHDH-SM-DevSpaces
    targetRevision: demo/udi-devspaces
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
