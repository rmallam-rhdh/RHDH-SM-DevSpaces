# ROSA rosa-rwx5g overlay. No secrets — those stay in cluster Secret rhdh-secrets.
operator:
  enabled: false

instance:
  replicas: 1
  database:
    enableLocalDb: false

database:
  cnpg:
    enabled: true
    instances: 1
    storage: 10Gi
  external:
    enabled: true

secrets:
  mode: external

app:
  title: ROSA Golden Path Demo
  organization: Demo
  clusterBaseDomain: apps.rosa.rosa-rwx5g.f8y9.p3.openshiftapps.com
  baseUrl: https://backstage-developer-hub-rhdh.apps.rosa.rosa-rwx5g.f8y9.p3.openshiftapps.com
  readingAllow:
    - host: github.com
    - host: raw.githubusercontent.com
    - host: api.github.com
    - host: login.microsoftonline.com
    - host: graph.microsoft.com
    - host: app.snyk.io
    - host: api.snyk.io
    - host: bitbucket.org
    - host: jenkins.jenkins.svc
    - host: sonarqube.sonarqube.svc
    - host: vault.vault.svc
    - host: saas-stubs.saas-stubs.svc
    - host: mallamrakeshkumar.atlassian.net
    - host: wkf10640.live.dynatrace.com
    - host: wkf10640.apps.dynatrace.com
    - host: sso.dynatrace.com
    - host: dev374459.service-now.com

auth:
  environment: development
  signInPage:
    - microsoft
    - guest
  guest:
    enabled: true
  microsoft:
    enabled: true
    domainHint: mallamrakeshgmail.onmicrosoft.com

plugins:
  kubernetes:
    clusterName: rosa-rwx5g
    url: https://kubernetes.default.svc
    skipTLSVerify: true
    serviceAccountToken: ""
    caData: ""
  argocd:
    instances:
      - name: default
        url: https://openshift-gitops-server-openshift-gitops.apps.rosa.rosa-rwx5g.f8y9.p3.openshiftapps.com
        token: "${ARGOCD_TOKEN}"
  snyk:
    enabled: false
    mocked: true
  servicenow:
    baseUrl: "${SERVICENOW_BASE_URL}"
    username: "${SERVICENOW_USERNAME}"
    password: "${SERVICENOW_PASSWORD}"
  vault:
    secretEngine: secrets
    kvVersion: 2
    baseUrl: http://vault.vault.svc:8200
    token: "${VAULT_TOKEN}"
