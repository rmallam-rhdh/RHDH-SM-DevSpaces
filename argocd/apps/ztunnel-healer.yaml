---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztunnel-healer
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: acme-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam/RHDH-SM-DevSpaces
    targetRevision: main
    path: components/ztunnel-healer/base
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-mesh-tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
