---
# OSSM3 + Kiali operators only. Istio/ZTunnel/Kiali CRs are rhdh-platform-gitops.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-mesh-operator
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: service-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam/RHDH-SM-DevSpaces
    targetRevision: main
    path: components/service-mesh/operator
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
