---
# RHDH Helm instance for ROSA rosa-rwx5g. Operator lives in openshift-operators.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: developer-hub
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: developer-hub
    environment: demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam/RHDH-SM-DevSpaces
    targetRevision: demo/udi-devspaces
    path: charts/developer-hub
    helm:
      valueFiles:
        - values.yaml
        - values-demo.yaml
        - values-rosa-rwx5g.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: operators.coreos.com
      kind: Subscription
      jsonPointers:
        - /status
    - group: rhdh.redhat.com
      kind: Backstage
      jqPathExpressions:
        - .status
    - group: ""
      kind: Secret
      name: rhdh-secrets
      jsonPointers:
        - /data
        - /metadata
