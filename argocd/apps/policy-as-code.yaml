---
# Manual only on this ROSA — kyverno-operator is not in OperatorHub.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-as-code
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: acme-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam/RHDH-SM-DevSpaces
    targetRevision: main
    path: components/policy-as-code/base
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
