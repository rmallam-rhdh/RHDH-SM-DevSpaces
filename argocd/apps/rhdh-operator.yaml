---
# RHDH operator only. Backstage CR is rhdh-platform-gitops Application developer-hub.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhdh-operator
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: developer-hub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam-rhdh/RHDH-SM-DevSpaces
    targetRevision: main
    path: components/developer-hub/operator
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
