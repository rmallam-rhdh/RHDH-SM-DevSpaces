---
# GitOps operator is already running; this Application tracks the Subscription.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-gitops-operator
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: gitops
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam-rhdh/RHDH-SM-DevSpaces
    targetRevision: main
    path: components/openshift-gitops/base
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-operators
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
